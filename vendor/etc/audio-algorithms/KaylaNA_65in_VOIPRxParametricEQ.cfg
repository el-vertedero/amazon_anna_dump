/*
    Parametric EQ Configuration EQv5.4
    options for FilterType : LOW_PASS, HIGH_PASS, BAND_PASS, NOTCH, PEAK, LOW_SHELF, HIGH_SHELF, BYPASS
    Fc : Cutoff/Center Frequency in Hertz
    Q:   Quality Factor
    GaindB: Gain in dB

*/

// this is the default Rx EQ, for models other than option 1 65" and 75".
// it's applied to TV models of 43", 50", and 55".
{
    "Bypass"            : false,
    "NumBiquads"        : 8,   // MUST be a multiple of 4

    "Biquad Definitions":
    [
        // Biquad 1.
        {
            "FilterType" : "LOW_SHELF",
            "Fc"         : 200,
            "Q"          : 1.0,
            "GaindB"     : -8.0
        },
        // Biquad 2.
        {
            "FilterType" : "HIGH_PASS",
            "Fc"         : 100,
            "Q"          : 0.5,
            "GaindB"     : -30.0   //this gain doesn't matter
        },
        // Biquad 3.
        {
            "FilterType" : "PEAK",
            "Fc"         : 6500,
            "Q"          : 1.0,
            "GaindB"     : 6.0
        },
        // Biquad 4.
        {
            "FilterType" : "PEAK",
            "Fc"         : 1200,
            "Q"          : 1.5,
            "GaindB"     : -5.0
        },
        // Biquad 5.
        {
            "FilterType" : "LOW_SHELF",
            "Fc"         : 400,
            "Q"          : 1.0,
            "GaindB"     : -3.0
        },
        // Biquad 2.
        {
            "FilterType" : "HIGH_SHELF", // to make up the level
            "Fc"         : 150,
            "Q"          : 0.5,
            "GaindB"     : -2.0
        },
        // Biquad 3.
        {
            "FilterType" : "PEAK",
            "Fc"         : 2200,
            "Q"          : 2.5,
            "GaindB"     : 4.0
        },
        // Biquad 4.
        {
            "FilterType" : "BYPASS",
            "Fc"         : 1200,
            "Q"          : 1.5,
            "GaindB"     : -5.0
        }
   ]
}
